[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers -q -m "not slow and not legacy_kb"
markers =
    unit: fast isolated unit tests
    integration: tests that touch DB, FAISS mocks, or API
    regression: SaaS regression scenarios from product requirements
    slow: tests that may take >5s
    legacy_kb: heavy KB/FAISS/PDF tests (optional CI job)
    ci_gate: required SaaS trust + enterprise smoke tests
