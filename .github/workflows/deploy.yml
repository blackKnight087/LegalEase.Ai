name: LegalEase Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m pytest tests/test_saas_day4_6.py tests/test_saas_production_guards.py tests/test_p0_saas.py tests/test_p1_ops.py tests/test_p2_saas.py -q --tb=short
        env:
          KB_PIPELINE_DEBUG: "0"
          RAG_ENABLE_CROSS_ENCODER: "0"

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        run: docker build -f deploy/Dockerfile.api -t legalease-api:ci .
      - name: Build Web image
        run: docker build -f deploy/Dockerfile.web --build-arg NEXT_PUBLIC_API_URL=http://127.0.0.1/api -t legalease-web:ci .

