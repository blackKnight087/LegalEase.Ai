# Optional overlay: nginx -> host API :8000 and Web :3000 (hybrid deploy)
services:
  nginx-hybrid:
    image: nginx:1.27-alpine
    profiles: ["hybrid-nginx"]
    restart: unless-stopped
    ports:
      - "8080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ../nginx/nginx-hybrid-host.conf:/etc/nginx/conf.d/default.conf:ro
