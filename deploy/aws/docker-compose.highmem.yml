# Overlay for 16–32GB RAM EC2 (t3.xlarge, m7i-flex.xlarge, etc.)
services:
  api:
    environment:
      UVICORN_WORKERS: "2"
      LOW_RESOURCE_MODE: "0"
      HF_EMBEDDING_MODEL: BAAI/bge-base-en-v1.5
      STT_MODEL: small
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 10G

  web:
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G

  worker:
    profiles: ["workers"]
    deploy:
      resources:
        limits:
          memory: 2G

  ml-worker:
    profiles: ["workers"]
    deploy:
      resources:
        limits:
          memory: 3G
