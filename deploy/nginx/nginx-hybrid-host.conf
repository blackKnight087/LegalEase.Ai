# Hybrid deploy: nginx in Docker proxies to API/Web on the Windows host.
# Usage (from project root):
#   docker compose -f docker-compose.yml -f deploy/hybrid/docker-compose.nginx.yml --profile hybrid-nginx up -d
#
# Requires: API on host :8000, Next on host :3000 (run_backend.ps1 + run_web_prod.ps1)
# DuckDNS / TLS: terminate HTTPS on host (Caddy/IIS) or use --profile ssl with certs in deploy/nginx/ssl/

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;

upstream api_host {
    server host.docker.internal:8000;
}

upstream web_host {
    server host.docker.internal:3000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 55m;

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://api_host;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://web_host;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
